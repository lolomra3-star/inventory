<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Inventaris</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--tx:#18212b;--mu:#64707d;--ac:#1f5fbf;--bd:#d5dbe3;--ok:#1a7f4b;--bad:#c0392b;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#10151b;--card:#1a212a;--tx:#e6ebf1;--mu:#8f9bab;--ac:#6aa6ff;--bd:#2c3642;--ok:#4cc38a;--bad:#ff7b6b;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{font:15px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:4px 0 2px}.sum{color:var(--mu);font-size:13px;margin-bottom:10px}
input,select,button,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);margin:3px 0 10px}
button{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:8px 12px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
@media(prefers-color-scheme:dark){button.p{color:#0b1220}}
button.d{color:var(--bad)}
label{font-size:13px;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.f0{flex:0 0 auto}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.nm{font-weight:600}.tag{font-size:12px;color:var(--mu)}
.t-storage{border-left:4px solid #3b82f6}.t-daily{border-left:4px solid #22a06b}.t-other{border-left:4px solid #d19a1e}
.sp{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.sp span{font-size:12px;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:1px 7px}
.q{display:flex;align-items:center;gap:6px}.q b{min-width:28px;text-align:center}
.q button{padding:2px 10px}
.acts{display:flex;gap:6px;margin-top:6px}.acts button{padding:4px 10px;font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;padding:14px 4px;background:none;color:var(--mu)}
nav button.on{color:var(--ac);font-weight:700}
.v{display:none}.v.on{display:block}
#out{background:#0d1117;color:#c9d1d9;font:13px/1.4 ui-monospace,Menlo,monospace;padding:10px;border-radius:8px;height:46vh;overflow:auto;white-space:pre-wrap;word-break:break-word}
#cmd{font-family:ui-monospace,Menlo,monospace;margin-top:8px}
.empty{color:var(--mu);text-align:center;padding:28px 8px}
.chips{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto}.chips button{white-space:nowrap;padding:5px 12px;border-radius:99px}
.chips button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
@media(prefers-color-scheme:dark){.chips button.on{color:#0b1220}}
</style></head><body><main>
<h1>Inventaris <small style="font-weight:400;color:var(--mu)">v3</small></h1><div class="sum" id="sum"></div>

<section class="v on" id="v-list">
  <input id="q" placeholder="Cari nama, kategori, spek…" oninput="renderList()">
  <div class="chips" id="chips"></div>
  <div id="list"></div>
</section>

<section class="v" id="v-form">
  <div class="card">
    <b id="ftitle">Tambah barang</b><br><br>
    <label>Nama barang</label><input id="f-name">
    <label>Jenis</label>
    <select id="f-type"><option value="storage">Storage</option><option value="daily">Daily Use</option><option value="other">Other Use</option></select>
    <label>Sub kategori (ketik sendiri)</label>
    <input id="f-cat" list="cats" oninput="applyTpl()"><datalist id="cats"></datalist>
    <label>Jumlah</label><input id="f-qty" type="number" min="0" value="1" inputmode="numeric">
    <label>Spek</label><div id="specs"></div>
    <button class="f0" onclick="addSpecRow()">+ Spek</button>
    <div class="row" style="margin-top:12px"><button class="p" onclick="saveForm()">Simpan</button><button onclick="resetForm();show('list')">Batal</button></div>
  </div>
</section>

<section class="v" id="v-tpl">
  <div class="card">
    <b>Template spek</b>
    <div class="tag" style="margin:4px 0 10px">Tiap sub kategori bisa punya daftar kolom spek yang otomatis muncul saat input.</div>
    <label>Sub kategori</label><input id="t-cat" placeholder="mis. SSD">
    <label>Kolom spek (pisah koma)</label><input id="t-fields" placeholder="kapasitas, interface, merek">
    <button class="p" onclick="saveTpl()">Simpan template</button>
  </div>
  <div id="tpls"></div>
</section>

<section class="v" id="v-cli">
  <div id="out"></div>
  <input id="cmd" placeholder="ketik perintah, mis. help" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">
  <div class="card" style="margin-top:12px"><b>Tempel banyak perintah</b>
    <div class="tag" style="margin:4px 0 8px">Satu perintah per baris. Baris berawalan # diabaikan.</div>
    <textarea id="bulk" rows="6" placeholder="tempel di sini" autocapitalize="off" autocorrect="off" spellcheck="false" style="font-family:ui-monospace,Menlo,monospace;font-size:13px"></textarea>
    <button class="p" onclick="runBulk()">Jalankan semua</button></div>
</section>

<section class="v" id="v-data">
  <div class="card"><b>Backup data</b><div class="tag" style="margin:4px 0 10px">Data tersimpan di browser perangkat ini. Ekspor berkala untuk cadangan.</div>
    <div class="row"><button onclick="exportJson()">Ekspor JSON</button><button onclick="document.getElementById('imp').click()">Impor JSON</button></div>
    <input id="imp" type="file" accept=".json,application/json" style="display:none" onchange="importJson(this)">
  </div>
</section>
</main>
<nav>
  <button class="on" data-v="list" onclick="show('list')">Barang</button>
  <button data-v="form" onclick="resetForm();show('form')">Tambah</button>
  <button data-v="tpl" onclick="show('tpl')">Template</button>
  <button data-v="cli" onclick="show('cli')">CLI</button>
  <button data-v="data" onclick="show('data')">Data</button>
</nav>
<script>
const TL={storage:'Storage',daily:'Daily Use',other:'Other Use'};
let S={items:[],tpls:{},next:1},filt='all',editId=null;
try{const r=localStorage.getItem('inv1');if(r)S=JSON.parse(r)}catch(e){}
function save(){try{localStorage.setItem('inv1',JSON.stringify(S))}catch(e){alert('Gagal menyimpan ke penyimpanan browser')}}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function show(v){document.querySelectorAll('.v').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  if(v==='tpl')renderTpl();if(v==='cli'&&!$('out').textContent)log('Ketik help untuk daftar perintah.');
  if(v==='form'&&!$('specs').children.length)addSpecRow()}
function refresh(){renderList();renderTpl();$('cats').innerHTML=cats().map(c=>`<option value="${esc(c)}">`).join('');
  const u=S.items.reduce((a,i)=>a+i.qty,0);$('sum').textContent=`${S.items.length} jenis barang, ${u} unit total`}
function cats(){return [...new Set([...Object.keys(S.tpls),...S.items.map(i=>i.cat).filter(Boolean)])].sort()}
function renderList(){
  const q=$('q').value.toLowerCase();
  $('chips').innerHTML=['all','storage','daily','other'].map(t=>`<button class="${filt===t?'on':''}" onclick="filt='${t}';renderList()">${t==='all'?'Semua':TL[t]}</button>`).join('');
  const L=S.items.filter(i=>(filt==='all'||i.type===filt)&&(!q||(i.name+' '+i.cat+' '+Object.entries(i.specs).map(e=>e.join(' ')).join(' ')).toLowerCase().includes(q)));
  $('list').innerHTML=L.length?L.map(i=>`<div class="card t-${i.type}"><div class="top"><span class="nm">${esc(i.name)}</span><span class="tag">#${i.id}</span></div>
  <div class="tag">${TL[i.type]}${i.cat?' / '+esc(i.cat):''}</div>
  ${Object.keys(i.specs).length?'<div class="sp">'+Object.entries(i.specs).map(([k,v])=>`<span>${esc(k)}: ${esc(v)}</span>`).join('')+'</div>':''}
  <div class="top"><div class="q"><button onclick="chg(${i.id},-1)">−</button><b>${i.qty}</b><button onclick="chg(${i.id},1)">+</button></div>
  <div class="acts"><button onclick="edit(${i.id})">Ubah</button><button class="d" onclick="del(${i.id})">Hapus</button></div></div></div>`).join('')
  :'<div class="empty">Belum ada barang. Buka tab Tambah atau pakai CLI.</div>'}
function chg(id,d){const i=S.items.find(x=>x.id===id);i.qty=Math.max(0,i.qty+d);save();refresh()}
function del(id){if(confirm('Hapus barang ini?')){S.items=S.items.filter(i=>i.id!==id);save();refresh()}}
function addSpecRow(k='',v=''){const d=document.createElement('div');d.className='row';
  d.innerHTML=`<input placeholder="nama spek" value="${esc(k)}"><input placeholder="isi" value="${esc(v)}"><button class="f0 d" onclick="this.parentNode.remove()">×</button>`;$('specs').appendChild(d)}
function applyTpl(){const f=S.tpls[$('f-cat').value.trim()];if(!f)return;
  const have=[...$('specs').children].map(r=>r.children[0].value.trim());
  [...$('specs').children].forEach(r=>{if(!r.children[0].value&&!r.children[1].value)r.remove()});
  f.forEach(k=>{if(!have.includes(k))addSpecRow(k)})}
function resetForm(){editId=null;$('ftitle').textContent='Tambah barang';$('f-name').value='';$('f-cat').value='';$('f-qty').value=1;$('f-type').value='storage';$('specs').innerHTML='';addSpecRow()}
function edit(id){const i=S.items.find(x=>x.id===id);editId=id;show('form');$('specs').innerHTML='';
  $('ftitle').textContent='Ubah barang #'+id;$('f-name').value=i.name;$('f-type').value=i.type;$('f-cat').value=i.cat;$('f-qty').value=i.qty;
  Object.entries(i.specs).forEach(([k,v])=>addSpecRow(k,v));addSpecRow()}
function saveForm(){const name=$('f-name').value.trim();if(!name){alert('Nama barang wajib diisi');return}
  const specs={};[...$('specs').children].forEach(r=>{const k=r.children[0].value.trim(),v=r.children[1].value.trim();if(k&&v)specs[k]=v});
  const o={name,type:$('f-type').value,cat:$('f-cat').value.trim(),qty:Math.max(0,parseInt($('f-qty').value)||0),specs};
  if(editId){Object.assign(S.items.find(x=>x.id===editId),o)}else{S.items.push({id:S.next++,...o})}
  save();resetForm();refresh();show('list')}
function saveTpl(){const c=$('t-cat').value.trim(),f=$('t-fields').value.split(',').map(s=>s.trim()).filter(Boolean);
  if(!c||!f.length){alert('Isi sub kategori dan minimal satu kolom');return}S.tpls[c]=f;save();$('t-cat').value='';$('t-fields').value='';refresh()}
function renderTpl(){const k=Object.keys(S.tpls);$('tpls').innerHTML=k.length?k.map(c=>`<div class="card"><div class="top"><span class="nm">${esc(c)}</span>
  <span><button onclick="$('t-cat').value=${esc(JSON.stringify(c)).replace(/'/g,'&#39;')};$('t-fields').value='${esc(S.tpls[c].join(', ')).replace(/'/g,'&#39;')}';scrollTo(0,0)">Ubah</button> <button class="d" onclick="delTpl(${esc(JSON.stringify(JSON.stringify(c))).replace(/'/g,'&#39;')})">Hapus</button></span></div>
  <div class="sp">${S.tpls[c].map(f=>`<span>${esc(f)}</span>`).join('')}</div></div>`).join(''):'<div class="empty">Belum ada template.</div>'}
function delTpl(j){delete S.tpls[JSON.parse(j)];save();refresh()}
function exportJson(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='inventaris-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function importJson(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);
  if(!Array.isArray(d.items))throw 0;if(!confirm('Ganti semua data saat ini dengan isi file?'))return;S={items:d.items,tpls:d.tpls||{},next:d.next||(Math.max(0,...d.items.map(i=>i.id))+1)};save();refresh();alert('Impor berhasil')}catch(e){alert('File tidak valid')}};r.readAsText(f);el.value=''}

/* CLI */
let Q=null;
function log(t,cls){if(Q){Q.push(t);return}const o=$('out');o.textContent+=(o.textContent?'\n':'')+t;o.scrollTop=o.scrollHeight}
const tok=s=>(s.match(/(?:[^\s="]+="[^"]*"|"[^"]*"|\S+)/g)||[]).map(t=>t.replace(/"/g,''));
const TM={s:'storage',storage:'storage',d:'daily',daily:'daily',o:'other',other:'other'};
function kv(a){const o={},p=[];a.forEach(t=>{const i=t.indexOf('=');i>0?o[t.slice(0,i)]=t.slice(i+1):p.push(t)});return{o,p}}
function fmt(i){const s=Object.entries(i.specs).map(([k,v])=>k+'='+v).join(', ');return `#${i.id} ${i.name} [${i.type}${i.cat?'/'+i.cat:''}] x${i.qty}${s?' | '+s:''}`}
function run(line){if(line.trim().startsWith('#'))return;const a=tok(line.trim());if(!a.length)return;const c=a.shift().toLowerCase(),{o,p}=kv(a);
  const find=id=>S.items.find(i=>i.id===parseInt(id));
  if(c==='help')return log(`add "Nama" type=s|d|o cat=SSD qty=2 spek=isi ...
ls [kata] [type=s|d|o]     daftar barang
set <id> key=val ...       ubah (name,type,cat,qty atau spek)
qty <id> <n|+n|-n>         atur jumlah
rm <id>                    hapus
tpl ls | tpl add SSD kapasitas,interface | tpl rm SSD
stats                      ringkasan
export                     cetak JSON
clear                      bersihkan layar`);
  if(c==='clear'){$('out').textContent='';return}
  if(c==='add'){const name=p[0];if(!name)return log('Error: nama kosong. Contoh: add "SSD 1TB" type=s cat=SSD qty=2 kapasitas=1TB');
    const type=TM[(o.type||'s').toLowerCase()];if(!type)return log('Error: type harus s/d/o (storage/daily/other)');
    const specs={};Object.keys(o).forEach(k=>{if(!['type','cat','qty'].includes(k))specs[k]=o[k]});
    const it={id:S.next++,name,type,cat:o.cat||'',qty:o.qty===undefined?1:Math.max(0,parseInt(o.qty)||0),specs};S.items.push(it);save();refresh();
    const miss=(S.tpls[it.cat]||[]).filter(f=>!(f in specs));log('OK '+fmt(it)+(miss.length?'\nTemplate '+it.cat+' belum terisi: '+miss.join(', '):''));return}
  if(c==='ls'){const q=p.join(' ').toLowerCase(),t=o.type?TM[o.type.toLowerCase()]:null;
    const L=S.items.filter(i=>(!t||i.type===t)&&(!q||fmt(i).toLowerCase().includes(q)));return log(L.length?L.map(fmt).join('\n'):'(kosong)')}
  if(c==='set'){const i=find(p[0]);if(!i)return log('Error: id tidak ada');
    Object.entries(o).forEach(([k,v])=>{if(k==='name')i.name=v;else if(k==='cat')i.cat=v;else if(k==='qty')i.qty=Math.max(0,parseInt(v)||0);
      else if(k==='type'&&TM[v])i.type=TM[v];else if(v==='')delete i.specs[k];else i.specs[k]=v});save();refresh();return log('OK '+fmt(i))}
  if(c==='qty'){const i=find(p[0]);if(!i||!p[1])return log('Error: qty <id> <n|+n|-n>');const n=parseInt(p[1]);
    i.qty=Math.max(0,/^[+-]/.test(p[1])?i.qty+n:n);save();refresh();return log('OK '+fmt(i))}
  if(c==='rm'){const i=find(p[0]);if(!i)return log('Error: id tidak ada');S.items=S.items.filter(x=>x!==i);save();refresh();return log('Dihapus: '+i.name)}
  if(c==='tpl'){const s=(p.shift()||'').toLowerCase();
    if(s==='ls')return log(Object.keys(S.tpls).map(k=>k+': '+S.tpls[k].join(', ')).join('\n')||'(belum ada template)');
    if(s==='add'){const n=p.shift(),f=p.join('').split(',').map(x=>x.trim()).filter(Boolean);if(!n||!f.length)return log('Error: tpl add <kategori> f1,f2');S.tpls[n]=f;save();refresh();return log('Template '+n+': '+f.join(', '))}
    if(s==='rm'){delete S.tpls[p[0]];save();refresh();return log('OK')}return log('Error: tpl ls|add|rm')}
  if(c==='stats'){const by={};S.items.forEach(i=>by[i.type]=(by[i.type]||0)+i.qty);return log(`${S.items.length} jenis, ${S.items.reduce((a,i)=>a+i.qty,0)} unit\n`+Object.keys(TL).map(t=>TL[t]+': '+(by[t]||0)).join('\n'))}
  if(c==='export')return log(JSON.stringify(S));
  log('Perintah tidak dikenal. Ketik help')}
$('cmd').addEventListener('keydown',e=>{if(e.key==='Enter'){const v=e.target.value;if(!v.trim())return;log('> '+v);run(v);e.target.value=''}});
function batch(t){const L=t.split(/\r?\n/).filter(l=>l.trim()&&!l.trim().startsWith('#'));Q=[];L.forEach(run);const E=Q.filter(x=>/^(Error|Perintah)/.test(x));Q=null;
  log(`Batch selesai: ${L.length} perintah, ${E.length} error. Total ${S.items.length} jenis barang.`+(E.length?'\n'+E.join('\n'):''))}
function runBulk(){const t=$('bulk').value;if(!t.trim()){alert('Kotak masih kosong');return}log('> [batch '+t.trim().split(/\r?\n/).length+' baris]');batch(t);$('bulk').value='';refresh()}
$('cmd').addEventListener('paste',e=>{const t=(e.clipboardData||window.clipboardData).getData('text');if(!/\n/.test(t.trim()))return;e.preventDefault();log('> [paste '+t.trim().split(/\r?\n/).length+' baris]');batch(t)});
refresh();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
